name: CPU Verification & Release Hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpu-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch and package dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Run unit test suite and release hygiene audit
        run: pytest -v

      - name: Run 30-second CPU installation and LVZ root-skipping demo
        run: python scripts/verify_install.py

      - name: Reproduce publication tables (Markdown & LaTeX)
        run: python scripts/reproduce_tables.py --out-dir /tmp/ci_tables

      - name: Reproduce publication figures from compact archive
        run: python scripts/reproduce_all_figures.py --out-dir /tmp/ci_figures

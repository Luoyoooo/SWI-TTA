[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swi-tta-diagnostics"
version = "1.0.0"
description = "Diagnostic benchmark, physics-referee convergence audit, and publication figure suite for test-time adaptation in surface-wave dispersion inversion."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Rui Mao"}
]
keywords = [
    "geophysics",
    "surface-wave-inversion",
    "test-time-adaptation",
    "dispersion",
    "disba",
    "reproducibility",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "disba>=0.7.0",
    "numba>=0.59",
    "torch>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/Luoyoooo/swi-tta-diagnostics"
Repository = "https://github.com/Luoyoooo/swi-tta-diagnostics"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["swi_tta*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
